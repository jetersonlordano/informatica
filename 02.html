<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist - Assistência em Informática</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #005a9c;
    }
    .grupo {
      background-color: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0077cc;
    }
    label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h1>Checklist de Problemas - Atividade em Grupo</h1>

  <div class="grupo">
    <h2>Grupo 1</h2>
    <label><input type="checkbox"> Computador não liga de forma alguma</label>
    <label><input type="checkbox"> Pen drive não é reconhecido pelo sistema</label>
    <label><input type="checkbox"> Impressora instalada, mas não imprime</label>
    <label><input type="checkbox"> Notebook superaquece durante o uso</label>
    <label><input type="checkbox"> Windows demora muito para iniciar</label>
    <label><input type="checkbox"> Ícones da Área de Trabalho sumiram</label>
    <label><input type="checkbox"> Wi-Fi conecta, mas não acessa a internet</label>
    <label><input type="checkbox"> Um programa não abre mesmo instalado</label>
    <label><input type="checkbox"> Webcam integrada não funciona em chamadas</label>
    <label><input type="checkbox"> Caixas de som estão conectadas, mas não emitem som</label>
  </div>

  <div class="grupo">
    <h2>Grupo 2</h2>
    <label><input type="checkbox"> Computador liga, mas não aparece imagem no monitor</label>
    <label><input type="checkbox"> Teclado ou mouse não funcionam</label>
    <label><input type="checkbox"> Impressora com impressão falhada ou parcial</label>
    <label><input type="checkbox"> Tela do notebook pisca intermitentemente</label>
    <label><input type="checkbox"> Windows reinicia sozinho sem aviso</label>
    <label><input type="checkbox"> Windows Explorer trava ou não responde</label>
    <label><input type="checkbox"> Conexão cabeada sem acesso</label>
    <label><input type="checkbox"> Mensagem de “Conexão limitada” aparece</label>
    <label><input type="checkbox"> Data e hora do sistema se alteram sozinhas</label>
    <label><input type="checkbox"> Navegador extremamente lento</label>
  </div>

  <div class="grupo">
    <h2>Grupo 3</h2>
    <label><input type="checkbox"> Computador liga, mas o sistema não inicia</label>
    <label><input type="checkbox"> Impressora não é reconhecida pelo computador</label>
    <label><input type="checkbox"> Coolers (ventoinhas) fazendo barulho alto</label>
    <label><input type="checkbox"> Bateria do notebook não carrega corretamente</label>
    <label><input type="checkbox"> Tela azul da morte (BSOD)</label>
    <label><input type="checkbox"> Programas abrindo sozinhos ao ligar</label>
    <label><input type="checkbox"> HD ou pendrive não aparecem</label>
    <label><input type="checkbox"> Erro de “Permissão negada” ao abrir pastas</label>
    <label><input type="checkbox"> Tela está invertida ou girada</label>
    <label><input type="checkbox"> Notificações indesejadas no navegador</label>
  </div>

  <div class="grupo">
    <h2>Grupo 4</h2>
    <label><input type="checkbox"> Computador desliga sozinho</label>
    <label><input type="checkbox"> Teclas do teclado digitam letras erradas</label>
    <label><input type="checkbox"> HD está fazendo ruídos incomuns</label>
    <label><input type="checkbox"> HDMI conectado, mas sem sinal</label>
    <label><input type="checkbox"> Tela congelando com frequência</label>
    <label><input type="checkbox"> Falta de espaço no disco C:</label>
    <label><input type="checkbox"> Arquivos desapareceram da Área de Trabalho</label>
    <label><input type="checkbox"> Mouse muito lento ou rápido demais</label>
    <label><input type="checkbox"> Microfone não capta som</label>
    <label><input type="checkbox"> Sites com muitas propagandas abrindo sozinhos</label>
  </div>

</body>
</html>
